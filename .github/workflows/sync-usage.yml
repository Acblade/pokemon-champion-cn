name: Sync usage and trainer rankings

on:
  schedule:
    # 15:00 Japan time.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: usage-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Update usage and trainer rankings
        run: npm run update-usage
        env:
          CHAMPS_SEASONS: '5'
          CHAMPS_RULES: '1,2'
          CHAMPS_DEFAULT_SEASON: '5'
          CHAMPS_DEFAULT_RULE: '1'
          CHAMPS_USAGE_SOURCE: gamewith
      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Lint
        run: npm run lint
      - name: Test damage calculator
        run: npx tsx scripts/test-champions-calc.ts
      - name: Check generated changes
        id: diff
        run: |
          if git diff --quiet -- src/generated/usage-datasets.json src/generated/pikalytics-usage.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit updated usage data
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/usage-datasets.json src/generated/pikalytics-usage.json
          git commit -m "chore: sync usage and trainer rankings"
          git push
