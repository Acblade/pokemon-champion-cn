name: Sync team shares

on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * *'

permissions:
  contents: write

concurrency:
  group: team-share-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Update team share data
        run: npm run update-team-shares
      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Lint
        run: npm run lint
      - name: Test damage calculator
        run: npx tsx scripts/test-champions-calc.ts
      - name: Check generated changes
        id: diff
        run: |
          if git diff --quiet -- src/generated/team-shares.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit updated team shares
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/team-shares.json
          git commit -m "chore: sync team shares"
          git push
